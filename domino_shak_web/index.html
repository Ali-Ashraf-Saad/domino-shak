function micError(e){
  const n=e&&e.name||'';
  if(n==='NotAllowedError'||n==='PermissionDeniedError')return t('لازم تسمح بالميكروفون عشان تسجّل','Allow microphone access to record');
  if(n==='NotFoundError'||n==='DevicesNotFoundError')return t('مفيش ميكروفون متاح على الجهاز ده','No microphone is available on this device');
  if(n==='NotReadableError'||n==='AbortError'||n==='TrackStartError')return t('الميكروفون مشغول دلوقتي — قفّل أي تطبيق تاني بيستخدمه وجرب','The microphone is busy — close any other app using it and try again');
  if(n==='OverconstrainedError')return t('إعدادات الميكروفون مش متاحة على الجهاز ده','These microphone settings are not supported on this device');
  return t('مش قادر أفتح الميكروفون — جرب تاني','Could not open the microphone — try again');
}
async function startRec(){
  if(rec||recStarting)return;
  recStarting=true;
  vpBegin();
  stopVoice(true);
  // ردّ فعل بصري فوري قبل أي انتظار.
  $('#chatInRow').hidden=true;$('#recRow').hidden=false;
  const info=$('#recInfo');info.className='preparing';
  info.textContent=t('● بيجهّز الميكروفون…','● Preparing microphone…');
  const micBtn=$('#micBtn');if(micBtn)micBtn.classList.add('busy');
  if(!navigator.mediaDevices||!window.MediaRecorder){
    vpReport('unsupported');
    recStarting=false;
    $('#chatInRow').hidden=false;$('#recRow').hidden=true;
    if(micBtn)micBtn.classList.remove('busy');
    toast(t('المتصفح ده مش بيدعم تسجيل الصوت','This browser does not support voice recording'));return;
  }
  try{
    const ps=navigator.permissions&&navigator.permissions.query
      ?await navigator.permissions.query({name:'microphone'}) : null;
    vpMark('permission_check'+(ps?':'+ps.state:':unsupported'));
  }catch(e){vpMark('permission_check:unsupported')}
  let stream;
  try{vpMark('getusermedia_request');stream=await navigator.mediaDevices.getUserMedia({audio:true});vpMark('getusermedia_resolved')}
  catch(e){vpReport('getusermedia_failed');recStarting=false;
    $('#chatInRow').hidden=false;$('#recRow').hidden=true;
    if(micBtn)micBtn.classList.remove('busy');
    toast(micError(e));return}
  const mt=['audio/webm;codecs=opus','audio/webm','audio/mp4'].find(t=>MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(t));
  let mr;
  try{mr=mt?new MediaRecorder(stream,{mimeType:mt,audioBitsPerSecond:24000}):new MediaRecorder(stream);vpMark('mediarecorder_init')}
  catch(e){releaseMic({stream});vpReport('mediarecorder_failed');recStarting=false;
    $('#chatInRow').hidden=false;$('#recRow').hidden=true;
    if(micBtn)micBtn.classList.remove('busy');
    toast(t('مش قادر أسجّل','Could not record'));return}
  const chunks=[],t0=Date.now();
  let firstData=false;
  mr.ondataavailable=e=>{if(e.data&&e.data.size){chunks.push(e.data);if(!firstData){firstData=true;vpMark('first_audio_data')}}};
  mr.onerror=()=>{toast(t('حصلت مشكلة في التسجيل','There was a recording problem'));if(rec===r)stopRec(false)};
  const r={mr,stream,chunks,t0,timer:null,audioCtx:null,analyser:null,raf:0};
  // مؤشر مستوى الصوت (اختياري ومتاح في معظم المتصفحات).
  try{
    const AC=window.AudioContext||window.webkitAudioContext;
    if(AC){r.audioCtx=new AC();const src=r.audioCtx.createMediaStreamSource(stream);
      r.analyser=r.audioCtx.createAnalyser();r.analyser.fftSize=256;src.connect(r.analyser);
      if(r.audioCtx.state==='suspended')r.audioCtx.resume().catch(()=>{});}
  }catch(e){r.audioCtx=null;r.analyser=null}
  rec=r;recStarting=false;
  try{mr.start(250);vpReport('mediarecorder_started')}
  catch(e){rec=null;releaseMic(r);$('#chatInRow').hidden=false;$('#recRow').hidden=true;
    if(micBtn)micBtn.classList.remove('busy');toast(t('مش قادر أبدأ التسجيل','Could not start recording'));return}
  if(micBtn)micBtn.classList.remove('busy');
  info.className='';info.textContent=t('● بيسجّل 0:00','● Recording 0:00');
  const lvl=$('#recLevel');if(lvl)lvl.classList.add('live');
  if(r.analyser){
    const buf=new Uint8Array(r.analyser.fftSize);
    const tick=()=>{
      if(rec!==r)return;
      r.analyser.getByteTimeDomainData(buf);
      let sum=0;for(let i=0;i<buf.length;i++){const v=(buf[i]-128)/128;sum+=v*v}
      const lvlEl=$('#recLevel');
      if(lvlEl&&lvlEl.firstElementChild){
        lvlEl.firstElementChild.style.width=Math.min(100,10+Math.sqrt(sum/buf.length)*260).toFixed(0)+'%';
      }
      r.raf=requestAnimationFrame(tick);
    };
    r.raf=requestAnimationFrame(tick);
  }
  r.timer=setInterval(()=>{
    const sec=Math.floor((Date.now()-t0)/1000);
    info.textContent=t('● بيسجّل ','● Recording ')+fmtT(sec);
    if(sec>=30)stopRec(true);
  },250);
}
function stopRec(send){
  if(!rec)return;
  const r=rec;rec=null;clearInterval(r.timer);
  const dur=(Date.now()-r.t0)/1000;
  let released=false;
  const finish=()=>{
    if(released)return;released=true;
    releaseMic(r);
    $('#chatInRow').hidden=false;$('#recRow').hidden=true;
  };
  r.mr.onstop=()=>{
    finish();
    if(!send)return;
    if(dur<0.7){toast(t('التسجيل قصير أوي','The recording is too short'));return}
    const blob=new Blob(r.chunks,{type:r.mr.mimeType||'audio/webm'});
    if(blob.size>450000){toast(t('التسجيل كبير أوي','The recording is too large'));return}
    const fr=new FileReader();
    fr.onload=()=>sendChat({voice:fr.result,dur:Math.round(dur)});
    fr.onerror=()=>toast(t('مش قادر أجهّز الرسالة الصوتية','Could not prepare the voice message'));
    fr.readAsDataURL(blob);
  };
  try{r.mr.stop()}catch(e){finish()}
  // If onstop is never fired, still release the microphone after one second.
  setTimeout(finish,1000);
}
// Backgrounding the app ends the active recording session and frees the mic.
document.addEventListener('visibilitychange',function(){
  if(document.hidden&&rec)stopRec(false);
});
let playingId=null;
const voiceTotal=(a,m)=>isFinite(a.duration)&&a.duration>0?a.duration:(m.dur||1);
const voiceProg=(a,m)=>Math.min(1,a.currentTime/voiceTotal(a,m));
function setPlaying(id){playingId=id;if(chatOpen)renderChat(true);if(V)render()}
function stopVoice(manual){
  if(manual)voiceQ=[];
  if(curAudio){try{curAudio.pause()}catch(e){}curAudio=null}
  if(playingId!==null)setPlaying(null);
}
function queueVoice(id){
  if(rec)return;
  voiceQ.push(id);
  if(!curAudio)nextVoice();
}
function nextVoice(){
  const id=voiceQ.shift();
  if(id===undefined)return;
  playVoice(id,true);
}
function playVoice(id,auto){
  if(!auto&&playingId===id){stopVoice(true);return}
  const m=chatLog.find(x=>x.id===id);
  if(!m||typeof m.voice!=='string'){if(auto)nextVoice();else toast(t('الرسالة الصوتية دي انتهت','That voice message has ended'));return}
  if(!auto)voiceQ=[];
  stopVoice(false);
  const a=new Audio(m.voice);curAudio=a;
  a.addEventListener('timeupdate',()=>{
    if(curAudio!==a)return;
    const b=document.querySelector('.vplay[data-voice="'+id+'"] .prog');
    if(b)b.style.setProperty('--p',voiceProg(a,m));
  });
  a.addEventListener('ended',()=>{if(curAudio===a){curAudio=null;setPlaying(null);nextVoice()}});
  a.play().then(()=>{if(curAudio===a)setPlaying(id)}).catch(()=>{
    if(curAudio===a){curAudio=null;setPlaying(null)}
    if(!auto)toast(t('مش قادر أشغّل الصوت','Could not play the audio'));
    else if(!autoWarned){autoWarned=true;toast(t('المتصفح منع التشغيل التلقائي — اضغط ▶ في الدردشة','The browser blocked autoplay — tap ▶ in chat'))}
  });
}

/* =====================================================
   وضع اللعب ضد البوتات
   ===================================================== */
const LEVELS={easy:'سهل',medium:'متوسط',hard:'صعب'};
const LEVELS_EN={easy:'Easy',medium:'Medium',hard:'Hard'};
const lvlName=l=>(LANG==='en'?LEVELS_EN:LEVELS)[l]||l;
const LEVEL_DESC={
  easy:'بيلعب شبه عشوائي، وبيكدب كتير، ونادراً بيشك.',
  medium:'بيلعب بحذر، وبيشك لما الحسبة متظبطش.',
  hard:'بيحسب القطع اللي معاه، وبيراقب كدب كل لاعب، وبيشك بذكاء.'
};
const LEVEL_DESC_EN={
  easy:'Plays almost randomly, bluffs a lot, and rarely doubts.',
  medium:'Plays cautiously and doubts when the numbers do not add up.',
  hard:'Counts tiles, tracks every player\u2019s bluffing, and doubts smartly.'
};
const lvlDesc=l=>(LANG==='en'?LEVEL_DESC_EN:LEVEL_DESC)[l]||'';
const BOT_NAMES=['سمير','ليلى','كريم','هدى','عمر','نادين','يوسف','مها'];
const BOT_NAMES_EN=['Samir','Layla','Karim','Huda','Omar','Nadine','Youssef','Maha'];
const isBot=i=>!!(lobby.bots&&lobby.bots[i]);
const inSolo=()=>!!(lobby.bots&&lobby.bots.some(Boolean));
const hasNum=(t,n)=>t.a===n||t.b===n;
const lvlOf=i=>(lobby.botLv&&lobby.botLv[i])||botLevel;

function setBotDesc(level){
  const el=$('#botDesc');if(!el)return;
  el.dataset.ar=LEVEL_DESC[level]||'';
  el.dataset.en=LEVEL_DESC_EN[level]||'';
  el.textContent=LANG==='en'?el.dataset.en:el.dataset.ar;
}
function initBotSetup(){
  const nSeg=$('#botN'),lSeg=$('#botL');
  if(!nSeg||!lSeg)return;
  const pick=(seg,attr,after)=>seg.addEventListener('click',e=>{
    const b=e.target.closest('button');if(!b)return;
    seg.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));
    if(after)after(b.dataset[attr]);
  });
  pick(nSeg,'n');
  pick(lSeg,'l',setBotDesc);
  lSeg.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.l===botLevel));
  setBotDesc(botLevel);
  const go=$('#botGo');
  if(go)go.onclick=()=>{
    const n=+$('#botN .on').dataset.n;
    const level=$('#botL .on').dataset.l;
    const name=readName();if(!name)return;
    startSolo(n,level,name);
  };
}
initBotSetup();
function startSolo(n,level,name){
  closeOv();
  const pool=shuffle((LANG==='en'?BOT_NAMES_EN:BOT_NAMES).slice()).slice(0,n-1).map(x=>x);
  const names=[name,...pool];
  myName=name;isHost=true;mySeat=0;hostSeat=0;epoch=0;roomCode='BOT';size=n;botLevel=level;
  aborted=false;leaving=false;peer=null;V=null;lastSnap=null;prevHand=new Set();
  lobby={names,conns:names.map(()=>null),toks:names.map(()=>rand(6)),off:names.map(()=>false),bots:names.map((_,i)=>i>0),pids:names.map((_,i)=>i?'bot-'+i:myPid)};
  G=null;SESSION={games:[]};ready=[];
  startGame();
}

/* البوت بيشوف بس اللي لاعب حقيقي كان هيشوفه: قطعه، وعدد القطع، وعدد الكدب اللي اتكشف قبل كده */
const botFreq=hand=>{const f=[0,0,0,0,0,0,0];hand.forEach(t=>{f[t.a]++;if(t.b!==t.a)f[t.b]++});return f};
const rareScore=(t,f)=>f[t.a]+f[t.b];

function botWantsDoubt(seat){
  const L=G.last,lvl=lvlOf(seat),me=G.players[seat];
  const N=G.num,c=L.count;
  const k=me.hand.filter(t=>hasNum(t,N)).length;
  const u=7-k;                                   // أقصى عدد قطع فيها الرقم ده ممكن يكون عند غيري
  const lp=G.players[L.p],pending=lp.pending;
  const m=G.bm?G.bm[L.p]:{r:0,l:0};
  const rate=(m.l+1)/(m.r+3);                    // نسبة كدبه اللي اتكشف
  if(c>u)return Math.random()<(lvl==='easy'?.2:lvl==='medium'?.85:1);   // مستحيل تكون كلها صح
  const base=.12+.1*(c-1)+(G.pile.length>u?.15:0);
  if(lvl==='easy')return Math.random()<(pending?.4:.1);
  if(lvl==='medium')return Math.random()<Math.min(.8,base+(pending?.25:0));
  let p=.5*base+.5*Math.min(.9,rate*(1+.3*(c-1)));
  if(pending)p=Math.max(p,.5);
  else if(lp.hand.length<=2)p+=.08;
  const thr=pending?.3:.5;
  return Math.random()<1/(1+Math.exp(-(p-thr)*9));
}
function botMove(seat){
  const lvl=lvlOf(seat),me=G.players[seat],hand=me.hand,f=botFreq(hand);
  if(G.num===null){
    let best=0,bn=[];
    for(let n=0;n<=6;n++){
      const c=hand.filter(t=>hasNum(t,n)).length;
      if(c>best){best=c;bn=[n]}else if(c===best&&c>0)bn.push(n);
    }
    if(lvl==='easy'&&Math.random()<.25){
      const t=hand[Math.floor(Math.random()*hand.length)];
      return doPlay(seat,[t.id],Math.floor(Math.random()*7));
    }
    const n=bn[Math.floor(Math.random()*bn.length)];
    const have=hand.filter(t=>hasNum(t,n)).sort((x,y)=>rareScore(x,f)-rareScore(y,f));
    const take=lvl==='easy'?1:Math.min(lvl==='medium'?2:3,have.length);
    return doPlay(seat,have.slice(0,take).map(t=>t.id),n);
  }
  const N=G.num;
  const have=hand.filter(t=>hasNum(t,N)).sort((x,y)=>rareScore(x,f)-rareScore(y,f));
  if(have.length){
    if(lvl==='easy'&&Math.random()<.15)return doPass(seat);
    let take=lvl==='easy'?1:Math.min(lvl==='medium'?2:3,have.length);
    if(have.length===hand.length&&hand.length<=3&&lvl!=='easy')take=hand.length;   // يخلّص ورقه
    return doPlay(seat,have.slice(0,take).map(t=>t.id),N);
  }
  const bluffP=lvl==='easy'?.55:lvl==='medium'?(.25+(hand.length>6?.2:0)):((G.pile.length<=1?.4:.08)+(hand.length>=8?.2:0));
  if(Math.random()<bluffP){
    const t=hand.slice().sort((x,y)=>rareScore(x,f)-rareScore(y,f))[0];
    return doPlay(seat,[t.id],N);
  }
  return doPass(seat);
}
function botSchedule(){
  clearTimeout(botT);
  if(!G||G.phase!=='play'||!inSolo())return;
  const key=G.logN;
  const run=()=>{
    if(!G||G.phase!=='play'||G.logN!==key)return;
    if(revealOpen){botT=setTimeout(run,400);return}          // استنى اللاعب يخلّص قراية الكشف
    if(G.last&&botKeyChecked!==key){
      botKeyChecked=key;
      const order=shuffle(G.players.map((p,i)=>i).filter(i=>isBot(i)&&!G.players[i].finished&&i!==G.last.p));
      for(const i of order){if(botWantsDoubt(i)){doDoubt(i);return}}
    }
    const t=G.turn;
    if(isBot(t)&&!G.players[t].finished){
      botT=setTimeout(()=>{
        if(!G||G.phase!=='play'||G.logN!==key||G.turn!==t)return;
        if(revealOpen){botT=setTimeout(()=>botSchedule(),400);return}
        botMove(t);
      },600+Math.random()*900);
    }
  };
  botT=setTimeout(run,700+Math.random()*700);
}

async function requestWake(){
  try{
    if(S.wake&&navigator.wakeLock&&!wakeLock){
      wakeLock=await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release',()=>{wakeLock=null});
    }
  }catch(e){}
}

  if(document.hidden)return;
  if(V)requestWake();
  if(!isHost&&hostConn&&!hostConn.open&&cli.welcomed&&!reconnecting)onHostLost(hostConn);
});
initChat();
applyS();
document.addEventListener('pointerdown',()=>SFX.unlock(),{passive:true});
})();
